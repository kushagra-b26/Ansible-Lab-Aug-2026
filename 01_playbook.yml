---

- name: Network Getting Started First Playbook with Cisco Device
  connection: network_cli
  gather_facts: false
  hosts: all
  tasks:

    - name: Get config vyOS devices
      ios_facts:
        gather_subset: all


    - name: Display the config
      debug:
        msg: "The hosname is {{ ansible_net_hostname }} and the OS is {{ ansible_net_version }}"
        msg: "{{ hostvars[inventory_hostname]}}"

