version: 0.2

env:
  parameter-store:
    SSH_KEY: "/cicd/ansible/ssh_private_key"
    ANSIBLE_HOST: "/cicd/ansible/host"
    ANSIBLE_PORT: "/cicd/ansible/port"
    ANSIBLE_USER: "/cicd/ansible/user"

phases:
  build:
    commands:
      - mkdir -p ~/.ssh
      - echo "$SSH_KEY" > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa
      - echo "StrictHostKeyChecking no" > ~/.ssh/config
      
      - echo "Triggering AWX Job Template..."
      # Notice the double quotes around the whole command, and the backslashes \ before the inner quotes
      - "ssh -p $ANSIBLE_PORT $ANSIBLE_USER@$ANSIBLE_HOST 'curl -k -u admin:admin123 -X POST http://192.168.1.15:32000/api/v2/job_templates/9/launch/ --data \"{}\" -H \"Content-Type: application/json\"'"
      - echo "AWX Job triggered successfully!"
