version: 0.2

env:
  parameter-store:
    SSH_KEY: "/cicd/ansible/ssh_private_key"
    ANSIBLE_HOST: "/cicd/ansible/host"
    ANSIBLE_PORT: "/cicd/ansible/port"
    ANSIBLE_USER: "/cicd/ansible/user"

phases:
  build:
    commands:
      # 1. Setup SSH key to reach your server
      - mkdir -p ~/.ssh
      - echo "$SSH_KEY" > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa
      - echo "StrictHostKeyChecking no" > ~/.ssh/config
      
      # 2. Copy the new playbook to the remote Ansible server
      - echo "Copying Ansible playbook to remote server..."
      - scp -P $ANSIBLE_PORT cp_discover_unused_rules.yml $ANSIBLE_USER@$ANSIBLE_HOST:/tmp/cp_discover_unused_rules.yml
      
      # 3. Connect to your server and run the playbook
      - echo "Executing Ansible Playbook on remote server..."
      - ssh -p $ANSIBLE_PORT $ANSIBLE_USER@$ANSIBLE_HOST 'ansible-playbook /tmp/cp_discover_unused_rules.yml -i localhost,'
      - echo "Playbook executed successfully!"
