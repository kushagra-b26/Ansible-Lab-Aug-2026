version: 0.2

env:
  parameter-store:
    SSH_KEY: "/cicd/ansible/ssh_private_key"
    ANSIBLE_HOST: "/cicd/ansible/host"
    ANSIBLE_PORT: "/cicd/ansible/port"
    ANSIBLE_USER: "/cicd/ansible/user"

phases:
  build:
    commands:
      # 1. Setup SSH key to reach your server
      - mkdir -p ~/.ssh
      - echo "$SSH_KEY" > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa
      - echo "StrictHostKeyChecking no" > ~/.ssh/config
      
      # 2. Copy the playbook AND the inventory file to the remote server
      - echo "Copying Ansible playbook and inventory to remote server..."
      - scp -P $ANSIBLE_PORT cp_discover_unused_rules.yml inventory_checkpoint1.ini $ANSIBLE_USER@$ANSIBLE_HOST:/tmp/
      
      # 3. Connect and run the playbook using the inventory file
      - echo "Executing Ansible Playbook on remote server..."
      - ssh -p $ANSIBLE_PORT $ANSIBLE_USER@$ANSIBLE_HOST 'ansible-playbook /tmp/cp_discover_unused_rules.yml -i /tmp/inventory_checkpoint1.ini -e "gateway_group=gateways policy_name=Standard"'
      - echo "Playbook executed successfully!"
